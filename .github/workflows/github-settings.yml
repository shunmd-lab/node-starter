name: GitHub settings

# Pull-request-time validation of infra/github/**, scripts/github-settings.ts
# and this file's own contract is the required `github-settings` job in
# ci.yml -- see docs/decisions/0008-no-required-human-approval-solo-repo.md.
# This workflow only covers what that job cannot: comparing the declared
# state against the live repository, and applying it.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the declared settings to GitHub
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  drift:
    name: detect GitHub settings drift
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.8.1
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compare with GitHub
        run: node scripts/github-settings.ts --check --remote

  apply-guard:
    name: validate apply target
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main branch
        env:
          REF: ${{ github.ref }}
        run: test "${REF}" = "refs/heads/main"

  apply:
    name: apply GitHub settings
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true && github.ref == 'refs/heads/main'
    needs: apply-guard
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.8.1
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply desired state
        run: node scripts/github-settings.ts --apply
