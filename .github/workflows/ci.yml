name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '17 4 * * *'

# Least privilege by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `pnpm secret:scan` scans the commit history, not only the working
          # tree: a credential that was committed and then deleted is still
          # leaked, and a shallow clone cannot see it.
          fetch-depth: 0
          persist-credentials: false

      # Installs exactly the versions pinned in mise.toml, verified against
      # mise.lock. CI therefore runs the same toolchain as a laptop, from the
      # same file -- there is no second place where a Node version is written.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.8.1
          cache: true

      # --frozen-lockfile makes an out-of-date pnpm-lock.yaml a build failure
      # rather than something CI quietly repairs. It also means CI performs no
      # dependency resolution, so it cannot pick up a version the lockfile
      # never approved.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The standard gate uses the same command developers run locally.
      - name: Verify
        run: pnpm verify

  mutation:
    name: mutation
    runs-on: ubuntu-latest
    # Pull requests mutate only changed production files. Pushes to main and
    # scheduled runs retain a full mutation run as the repository-wide backstop.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR scope is calculated against the base SHA below.
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.8.1
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stryker reuses unchanged mutant results. The key includes the commit
      # so a successful run can publish a new snapshot; restore-keys lets a
      # pull request start from the latest main-branch snapshot.
      - name: Restore mutation snapshot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: ${{ runner.os }}-stryker-${{ hashFiles('pnpm-lock.yaml', 'stryker.config.json', 'vitest.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-stryker-${{ hashFiles('pnpm-lock.yaml', 'stryker.config.json', 'vitest.config.ts') }}-

      - name: Mutation test
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail

          if [ -n "${BASE_SHA}" ]; then
            # Filtered with grep rather than a git pathspec: git's `**` does
            # not match a file directly inside the directory, so
            # 'scripts/lib/**/*.ts' silently matched nothing and every pull
            # request reported "no changed production files".
            changed="$(git diff --name-only --diff-filter=ACMR "${BASE_SHA}" "${GITHUB_SHA}" | \
              grep -E '^(src|scripts/lib|scripts/github-settings)/.*\.ts$' | \
              grep -Ev '\.(test|spec)\.ts$' || true)"

            if [ -z "${changed}" ]; then
              echo 'No changed production files; mutation testing is not needed.'
              exit 0
            fi

            mutate_patterns="$(printf '%s\n' "${changed}" | paste -sd, -)"
            echo "Mutating changed production files: ${mutate_patterns}"
            pnpm test:mutation --mutate "${mutate_patterns}"
            exit 0
          fi

          echo 'Running the full mutation scope.'
          pnpm test:mutation

  # infra/github/rulesets/main.json requires this check by name, so a job
  # that stopped validating anything (renamed, wrong command, deleted) would
  # otherwise still show green. scripts/lib/github-settings-ci-contract.ts
  # checks the reverse direction: that this job exists and runs this exact
  # command.
  github-settings:
    name: github-settings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.8.1
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate GitHub settings
        run: node scripts/github-settings.ts --check

  # Changes to the files that define quality enforcement, the toolchain and
  # supply-chain settings deserve focused review. This job reports those
  # changes in the pull request without blocking otherwise valid work.
  protected-file-notice:
    name: protected file notice
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report changes to protected paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Must stay in step with .github/CODEOWNERS and the list in
          # docs/development-guide.md#protected-enforcement-layer. `.github/` is
          # matched whole rather than file by file: a composite action or an
          # issue template added later is enforcement-layer code too, and a list
          # that has to be extended for each new file is a list that will be out
          # of date the first time someone forgets.
          protected_paths='^(package\.json|pnpm-lock\.yaml|eslint\.config\.js|prettier\.config\.js|\.prettierignore|pnpm-workspace\.yaml|mise\.toml|mise\.lock|tsconfig\.json|vitest\.config\.ts|stryker\.config\.json|knip\.jsonc|\.dependency-cruiser\.json|\.jscpd\.json|\.editorconfig|\.gitattributes|\.github/|infra/|scripts/|AGENTS\.md|CLAUDE\.md|\.claude/)'
          changed="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -E "${protected_paths}" || true)"
          marker='<!-- node-starter-protected-file-notice -->'
          comments_url="https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100"
          comments_file="$(mktemp)"
          payload_file="$(mktemp)"
          trap 'rm -f "${comments_file}" "${payload_file}"' EXIT

          if [ -n "${changed}" ]; then
            body="$(printf '%s\n\n## Protected files changed\n\n%s\n\n```text\n%s\n```\n\n%s' \
              "${marker}" \
              'This pull request changes files that define quality enforcement, the toolchain, or supply-chain settings. Review these changes with particular care.' \
              "${changed}" \
              'This is an informational notice and does not block merging.')"
          else
            body=''
          fi

          set +e
          comments_status="$(curl --silent --show-error --output "${comments_file}" --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${comments_url}")"
          curl_status=$?
          set -e

          if [ "${curl_status}" -ne 0 ] || [[ ! "${comments_status}" =~ ^2 ]]; then
            echo "::warning::Could not inspect pull request comments (HTTP ${comments_status:-unknown}). The protected-file notice is informational and will not fail CI."
            exit 0
          fi

          if ! jq -e 'type == "array"' "${comments_file}" >/dev/null; then
            echo "::warning::GitHub returned an unexpected pull request comments response. The protected-file notice is informational and will not fail CI."
            exit 0
          fi

          comment_id="$(jq -r --arg marker "${marker}" '
            [.[] | select((.user.login // "") == "github-actions[bot]" and ((.body // "") | contains($marker))) | .id][0] // empty
          ' "${comments_file}")"

          if [ -z "${changed}" ]; then
            if [ -z "${comment_id}" ]; then
              echo "No protected paths touched."
              exit 0
            fi

            set +e
            delete_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/issues/comments/${comment_id}")"
            delete_curl_status=$?
            set -e

            if [ "${delete_curl_status}" -ne 0 ] || [ "${delete_status}" != "204" ]; then
              echo "::warning::Could not remove the stale protected-file notice (HTTP ${delete_status:-unknown}). The notice is informational and will not fail CI."
              exit 0
            fi

            echo "Removed the stale protected-file notice."
            exit 0
          fi

          jq -n --arg body "${body}" '{body: $body}' >"${payload_file}"
          if [ -n "${comment_id}" ]; then
            comment_url="https://api.github.com/repos/${REPOSITORY}/issues/comments/${comment_id}"
            request_method=PATCH
          else
            comment_url="https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments"
            request_method=POST
          fi

          set +e
          write_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request "${request_method}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "@${payload_file}" \
            "${comment_url}")"
          write_curl_status=$?
          set -e

          if [ "${write_curl_status}" -ne 0 ] || [[ ! "${write_status}" =~ ^2 ]]; then
            echo "::warning::Could not write the protected-file notice (HTTP ${write_status:-unknown}). This can happen when a fork pull request has a read-only token. The notice is informational and will not fail CI."
            exit 0
          fi

          if [ -n "${comment_id}" ]; then
            echo "Updated the protected-file notice."
          else
            echo "Created the protected-file notice."
          fi
